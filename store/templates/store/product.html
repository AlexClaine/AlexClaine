<html>
{% extends 'store/main.html' %}
{% load static %}
{% block content %}
{% block navbar %}
{% endblock navbar %}
<br><br>
    <div class="row">
        <div class="col-md-6">
            <div id="productCarousel" class="carousel slide" data-bs-ride="carousel">
                    <div class="carousel-inner">

                        <!-- MAIN IMAGE -->
                        <div class="carousel-item active">
                            <img  src="{{product.imageURL}}" class="product-main-img">
                        </div>

                        <!-- EXTRA IMAGES -->
                        {% for img in product.images.all %}
                        <div class="carousel-item">
                            <img src="{{ img.image.url }}"  class="Extra-image {{ forloop.counter }}">
                        </div>
                        {% endfor %}
                    </div>

                    <!-- Navigation arrows -->
                    <button class="carousel-control-prev" type="button" data-bs-target="#productCarousel" data-bs-slide="prev">
                        <span class="carousel-control-prev-icon"></span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#productCarousel" data-bs-slide="next">
                        <span class="carousel-control-next-icon"></span>
                    </button>

                    </div>

        </div>
        <div class="col-md-6">
            <div class="box-element">
                <h3><strong>{{product.name}}</strong></h3>
                <hr>
                <h4><strong>${{product.price|floatformat:2}}</strong></h4>
                <br>
                <button data-product="{{product.id}}" data-action="add" class="btn btn-outline-secondary add-btn update-cart">Add to Cart</button>
            </div><br><br>
            <div class="col-md-6">
                <div class="box-element-des" style="height:200px; overflow-y:auto;">
                    <h4><strong>Product Description</strong></h4><br>
                    <p style="display:inline-block; float:right;">
                    {{description}}</p>
                </div>
            </div>
        </div>
    </div>
{% endblock content %}

</html>
